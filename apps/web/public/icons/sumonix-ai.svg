<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background gradient: dark navy/purple -->
    <radialGradient id="bgGrad" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#1a2a5e"/>
      <stop offset="100%" stop-color="#0d1535"/>
    </radialGradient>

    <!-- Neon ring glow -->
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Center dot glow -->
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer edge glow halo -->
    <filter id="halo" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)"/>

  <!-- Outer neon glow halo (soft) -->
  <circle cx="60" cy="60" r="55" stroke="#00e5ff" stroke-width="6" stroke-opacity="0.25" fill="none" filter="url(#halo)"/>

  <!-- Neon ring (bright) -->
  <circle cx="60" cy="60" r="54" stroke="#00e8ff" stroke-width="2.5" fill="none" filter="url(#ringGlow)"/>

  <!-- Inner subtle ring -->
  <circle cx="60" cy="60" r="50" stroke="#00e8ff" stroke-width="0.6" stroke-opacity="0.3" fill="none"/>

  <!-- "A" / Lambda shape — two legs -->
  <!-- Left leg -->
  <path d="M30 88 L60 28 L90 88" stroke="#2a4a9a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Slightly lighter "A" on top -->
  <path d="M30 88 L60 28 L90 88" stroke="#3457b5" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Center glowing dot -->
  <circle cx="60" cy="64" r="9" fill="#00e8ff" filter="url(#dotGlow)"/>
  <!-- Bright core -->
  <circle cx="60" cy="64" r="6" fill="#00f5ff"/>
  <!-- White hot center -->
  <circle cx="60" cy="64" r="3" fill="white" opacity="0.9"/>
</svg>
