<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d5c4a"/>
      <stop offset="100%" stop-color="#0f6c5a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- Subtle top shine -->
  <rect width="512" height="256" rx="120" fill="url(#shine)"/>
  <!-- Gold accent -->
  <circle cx="390" cy="118" r="46" fill="#c97f3a"/>
  <circle cx="390" cy="118" r="32" fill="#d9922b"/>
  <!-- Bold "S" -->
  <text
    x="256"
    y="360"
    text-anchor="middle"
    font-family="'Arial Black', 'Helvetica Neue', Impact, sans-serif"
    font-size="320"
    font-weight="900"
    fill="white"
    filter="url(#shadow)"
  >S</text>
</svg>