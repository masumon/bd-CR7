<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d5c4a"/>
      <stop offset="100%" stop-color="#0f6c5a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" rx="42" fill="url(#bg)"/>
  <!-- Gold accent -->
  <circle cx="138" cy="42" r="16" fill="#c97f3a"/>
  <!-- Bold "S" -->
  <text
    x="90"
    y="128"
    text-anchor="middle"
    font-family="'Arial Black', 'Helvetica Neue', Impact, sans-serif"
    font-size="112"
    font-weight="900"
    fill="white"
    filter="url(#shadow)"
  >S</text>
</svg>