<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2a1e"/>
      <stop offset="100%" stop-color="#061510"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffc8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00ffc8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="31" fill="url(#glowGrad)"/>

  <!-- Main circle background -->
  <circle cx="32" cy="32" r="28" fill="url(#bgGrad)"/>

  <!-- Outer border ring -->
  <circle cx="32" cy="32" r="28" stroke="#00ffc8" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Inner ring accent -->
  <circle cx="32" cy="32" r="24" stroke="#00ffc8" stroke-width="0.4" stroke-opacity="0.3" stroke-dasharray="3 2"/>

  <!-- Head shape -->
  <rect x="18" y="15" width="28" height="26" rx="6" fill="#0a2a1f" stroke="#00ffc8" stroke-width="1" filter="url(#glow)"/>

  <!-- Eyes -->
  <rect x="22" y="22" width="7" height="5" rx="2" fill="#00ffc8" opacity="0.9"/>
  <rect x="35" y="22" width="7" height="5" rx="2" fill="#00ffc8" opacity="0.9"/>

  <!-- Eye pupils glow -->
  <rect x="24" y="23.5" width="3" height="2" rx="1" fill="white" opacity="0.8"/>
  <rect x="37" y="23.5" width="3" height="2" rx="1" fill="white" opacity="0.8"/>

  <!-- Mouth / grid pattern -->
  <rect x="23" y="31" width="18" height="1" rx="0.5" fill="#00ffc8" opacity="0.5"/>
  <rect x="23" y="33" width="18" height="1" rx="0.5" fill="#00ffc8" opacity="0.3"/>

  <!-- Antenna -->
  <line x1="32" y1="15" x2="32" y2="9" stroke="#00ffc8" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="32" cy="8" r="2" fill="#00ffc8" opacity="0.9"/>

  <!-- Ear / side connectors -->
  <rect x="12" y="22" width="6" height="10" rx="3" fill="#0a2a1f" stroke="#00ffc8" stroke-width="0.8"/>
  <rect x="46" y="22" width="6" height="10" rx="3" fill="#0a2a1f" stroke="#00ffc8" stroke-width="0.8"/>

  <!-- Neck -->
  <rect x="28" y="41" width="8" height="4" rx="1" fill="#0a2a1f" stroke="#00ffc8" stroke-width="0.8"/>

  <!-- Body base -->
  <rect x="20" y="45" width="24" height="8" rx="4" fill="#0a2a1f" stroke="#00ffc8" stroke-width="0.8"/>

  <!-- Body center dot -->
  <circle cx="32" cy="49" r="2" fill="#00ffc8" opacity="0.7"/>
  <circle cx="26" cy="49" r="1.2" fill="#00ffc8" opacity="0.4"/>
  <circle cx="38" cy="49" r="1.2" fill="#00ffc8" opacity="0.4"/>
</svg>
