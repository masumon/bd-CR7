services:
  - type: web
    name: bdcr7-api
    runtime: python
    pythonVersion: 3.11.9
    buildCommand: export CARGO_HOME=/tmp/.cargo && export RUSTUP_HOME=/tmp/.rustup && pip install --prefer-binary -r apps/api-core-python/requirements.txt
    startCommand: uvicorn main:app --app-dir apps/api-core-python --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Writable /tmp dir for Rust/maturin wheels during pip install
      - key: CARGO_HOME
        value: /tmp/.cargo

      # Runtime mode — required so CORS validation and production guards activate
      - key: APP_ENV
        value: production

      # No Redis service is provisioned; disable the Redis requirement guard
      - key: REQUIRE_REDIS_IN_PRODUCTION
        value: "false"

      # Secrets — set these in the Render Dashboard (not stored in the yaml)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Shared secret used by cron-safe internal governance refresh endpoint.
      - key: GOVERNANCE_REFRESH_SECRET
        sync: false
      # Comma-separated allowed CORS origins (non-secret).
      - key: CORS_ORIGINS
        value: https://bd-cr7.vercel.app

  - type: cron
    name: bdcr7-governance-refresh
    runtime: python
    pythonVersion: 3.11.9
    schedule: "*/15 * * * *"
    buildCommand: pip install --prefer-binary -r apps/api-core-python/requirements.txt
    startCommand: python apps/api-core-python/scripts/refresh_approval_suggestions.py
    envVars:
      # Keep cron runtime in production mode for consistent policy behavior.
      - key: APP_ENV
        value: production
      # Shared secret used for calling internal cron-safe refresh endpoint.
      - key: GOVERNANCE_REFRESH_SECRET
        sync: false
      # Optional fallback: bearer token for the authenticated refresh endpoint.
      - key: GOVERNANCE_REFRESH_BEARER_TOKEN
        sync: false
      # Override only if API URL changes from the default Render service URL.
      - key: GOVERNANCE_REFRESH_API_URL
        value: https://bd-cr7-api.onrender.com
